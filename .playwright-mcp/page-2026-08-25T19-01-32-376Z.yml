  - generic [ref=e186]:
    - heading "FAQ - What You Need to Know" [level=2] [ref=e188]
    - generic [ref=e189]:
      - generic [ref=e190]:
        - heading "Construction & Roofing" [level=3] [ref=e191]
        - article [ref=e192]:
          - button "Red Iron, Hybrid Steel & Post Frame — What's the Difference? " [ref=e193] [cursor=pointer]:
            - generic [ref=e194]: Red Iron, Hybrid Steel & Post Frame — What's the Difference?
            - generic [ref=e195]: 
          - paragraph [ref=e196]:
            - text: We build on three engineered systems.
            - strong [ref=e197]: Red iron steel
            - text: is the gold standard for barndominiums and shops — custom structural steel that won't warp, rot, or shrink, with wide open interiors and no load-bearing walls.
            - strong [ref=e198]: Hybrid steel frame
            - text: pairs a steel structure with wood-framing flexibility for a more cost-effective build without sacrificing quality.
            - strong [ref=e199]: Post frame construction
            - text: is our most budget-friendly, fully engineered option with a fast build timeline, ideal for maximizing size within a budget.
        - article [ref=e200]:
          - button "Why Does the Right Fastener (Screw) Matter? " [ref=e201] [cursor=pointer]:
            - generic [ref=e202]: Why Does the Right Fastener (Screw) Matter?
            - generic [ref=e203]: 
          - paragraph [ref=e204]: The fastener is the most exposed, most vulnerable part of any metal roof. A quality roof can last 40-60 years — but only if the screws holding it down last that long too. A cheap screw's washer can crack and its head can rust within a few years, while proper installation with a long-life capped screw avoids the cost of ever re-screwing a roof.
        - article [ref=e205]:
          - button "Which Fasteners Do We Use, and How Do We Choose Them? " [ref=e206] [cursor=pointer]:
            - generic [ref=e207]: Which Fasteners Do We Use, and How Do We Choose Them?
            - generic [ref=e208]: 
          - paragraph [ref=e209]: We install Mueller fasteners (Texas-made) matched to each specific job. Our default on any roof built to last is the Long-Life ZAC Screw, a zinc-aluminum capped fastener carrying a lifetime warranty against red-rust corrosion. We also use carbon steel self-drillers for standard panel-to-frame attachment, woodgrip screws for wood purlins and decking, and low-profile pan-head fasteners for standing-seam trim. We never mix cheap screws into a long-life roof, and every exposed head is color-matched to blend into the finished look.
        - article [ref=e210]:
          - button "How Does Roof Color Affect Heat and Energy Costs? " [ref=e211] [cursor=pointer]:
            - generic [ref=e212]: How Does Roof Color Affect Heat and Energy Costs?
            - generic [ref=e213]: 
          - paragraph [ref=e214]: Under the Texas sun, identical buildings with different roof colors can see surface temperatures differ by 50-80°F — white/light gray panels run around 110-120°F, while black/dark charcoal can hit 170-180°F. Modern "cool roof" coatings use infrared-reflective pigments that bounce invisible heat back into the sky while still showing a dark color to the eye, so a dark cool-coated roof can run 30-40°F cooler than a standard dark finish. A reflective, light-colored roof can also cut summer cooling costs by roughly 7-15%.
        - article [ref=e215]:
          - button "The Science Behind \"Cool Roof\" Coatings " [ref=e216] [cursor=pointer]:
            - generic [ref=e217]: The Science Behind "Cool Roof" Coatings
            - generic [ref=e218]: 
          - paragraph [ref=e219]: Sunlight is roughly 5% UV, 43% visible light, and 52% near-infrared (NIR) — and NIR carries over half the sun's heat while staying invisible to the eye. Cheap dark paint absorbs both the light you see and that invisible heat. Modern "cool" coatings use infrared-reflective pigments that show a dark color to your eye while bouncing that infrared heat back into the sky, with a reflective primer coat underneath catching whatever heat gets through. A dark roof will never be quite as cool as pure white, but modern coatings close the gap enough that color becomes a style choice, not a comfort trade-off.
        - article [ref=e220]:
          - button "Signature 200 vs. Signature 300 — Which Roof Coating Is Right for You? " [ref=e221] [cursor=pointer]:
            - generic [ref=e222]: Signature 200 vs. Signature 300 — Which Roof Coating Is Right for You?
            - generic [ref=e223]: 
          - paragraph [ref=e224]:
            - text: "Both finishes carry the same factory warranty: 30-year colorfastness, 40-year film integrity."
            - strong [ref=e225]: Signature 200 (SMP)
            - text: is a high-gloss, economical finish best for white and light colors, though it can fade and "chalk" over 15-20 years.
            - strong [ref=e226]: Signature 300 (70% Kynar PVDF)
            - text: is a low-gloss finish that's nearly bulletproof against UV and weather — worth the 15-30% premium for medium-to-dark colors that need to look new decades from now. Bare Galvalume reflects heat well when new but dulls and oxidizes within a few years, so a painted Signature panel outperforms it over the life of the building.
        - article [ref=e227]:
          - button "How Do I Choose My Roof Color? " [ref=e228] [cursor=pointer]:
            - generic [ref=e229]: How Do I Choose My Roof Color?
            - generic [ref=e230]: 
          - paragraph [ref=e231]: Going light or white, Signature 200 is a smart, money-saving choice. Going dark, or want it to look new in 30 years, Signature 300 PVDF is worth the investment. Roof color and coating are only part of the equation — proper ventilation and insulation work together with the roof to manage heat.
      - generic [ref=e232]:
        - heading "Windows" [level=3] [ref=e233]
        - article [ref=e234]:
          - button "What Should I Look for in a Budget-Friendly Window? " [ref=e235] [cursor=pointer]:
            - generic [ref=e236]: What Should I Look for in a Budget-Friendly Window?
            - generic [ref=e237]: 
          - paragraph [ref=e238]: Compare whole-window NFRC numbers, not "center-of-glass" marketing figures. For East Texas, target a U-Factor of 0.28 or below and an SHGC of 0.23 or below, plus a solid DP rating for storm season. Budget options like RELIABILT, Ply Gem, Elevate, and Simonton all use vinyl frames with Low-E + argon glass and land in a similar energy-performance range — the real differences come down to warranty strength, manufacturer backing, and installation quality.
        - article [ref=e239]:
          - button "How Do Budget Window Brands Compare? " [ref=e240] [cursor=pointer]:
            - generic [ref=e241]: How Do Budget Window Brands Compare?
            - generic [ref=e242]: 
          - paragraph [ref=e243]:
            - strong [ref=e244]: RELIABILT
            - text: (Lowe's, made by Atrium) carries a transferable lifetime vinyl warranty — step up from the entry 3201 series to the 3500/3900 series for a better-built window.
            - strong [ref=e245]: Ply Gem
            - text: (Home Depot) spans a wide quality range; its in-stock 500 Series is the weakest option (1-year warranty, 10-year glass), so verify the exact series before buying.
            - strong [ref=e246]: Elevate
            - text: is Texas-made and engineered for our climate, blocking over 75% of solar heat with TDI-approved windstorm ratings and a limited lifetime warranty.
            - strong [ref=e247]: Simonton's
            - text: Pro-Finish Contractor Series is Consumer Reports' highest-rated vinyl in its class, AAMA Gold certified, with the strongest build quality and brand backing in this tier.
        - article [ref=e248]:
          - button "What Premium Window Frame Materials Are Available? " [ref=e249] [cursor=pointer]:
            - generic [ref=e250]: What Premium Window Frame Materials Are Available?
            - generic [ref=e251]: 
          - paragraph [ref=e252]:
            - strong [ref=e253]: Fiberglass
            - text: is the premium workhorse — it expands and contracts at nearly the same rate as glass, keeping seals tight, and lasts 40-50+ years, making it the best all-around pick for East Texas heat.
            - strong [ref=e254]: Fibrex composite
            - text: (Andersen's proprietary wood-fiber/PVC blend) is about twice as strong as vinyl, heat-stable, and holds dark colors well.
            - strong [ref=e255]: Clad-wood
            - text: pairs a real wood interior with a low-maintenance exterior shell for a beautiful, high-end look, though it's the priciest option and the wood still needs occasional upkeep.
            - strong [ref=e256]: Solid wood
            - text: is classic and fully customizable but the highest-maintenance choice, and not ideal for Texas heat/humidity without diligent care. At the premium tier, only Pella offers a true vinyl option (250 Series) — a bridge between budget vinyl and full premium.
        - article [ref=e257]:
          - button "How Do Premium Window Brands Compare? " [ref=e258] [cursor=pointer]:
            - generic [ref=e259]: How Do Premium Window Brands Compare?
            - generic [ref=e260]: 
          - paragraph [ref=e261]:
            - strong [ref=e262]: Pella 250 Series
            - text: (vinyl) is steel-reinforced with up to 18 insulating chambers, hitting a U-factor as low as 0.27 and SHGC as low as 0.21 — great for budget-minded builds that still want a trusted national brand.
            - strong [ref=e263]: Pella
            - text: "'s fiberglass and wood lines (Impervia) are tested from -40°F to 180°F and resist warping, offering the widest range of materials under one brand."
            - strong [ref=e264]: Andersen
            - text: is built around Fibrex composite with the deepest color customization in the tier (50+ exterior colors on the E-Series) and a warranty that's transferable on upper lines.
            - strong [ref=e265]: Marvin
            - text: is a fiberglass specialist built on Ultrex, rated 8x stronger than vinyl, with a fully transferable warranty and the most heat-stable performance for Texas — best for forever homes.
        - article [ref=e266]:
          - button "What Are the Best Premium Window Options for East Texas Heat? " [ref=e267] [cursor=pointer]:
            - generic [ref=e268]: What Are the Best Premium Window Options for East Texas Heat?
            - generic [ref=e269]: 
          - paragraph [ref=e270]:
            - text: Every premium option far outlasts a budget window — the real choice is material and look. Fiberglass (Pella Impervia, Marvin Ultrex) leads on seal performance and holding dark colors in our heat, Andersen's Fibrex composite offers the deepest color customization, and clad-wood is a style upgrade with some added maintenance.
            - strong [ref=e271]: "Our recommendation:"
            - text: Marvin for the toughest, most heat-stable build with a fully transferable warranty; Pella Impervia for excellent fiberglass at a friendlier price; Andersen for maximum customization; and Pella's 250 Series for a trusted national brand on a tighter budget.
